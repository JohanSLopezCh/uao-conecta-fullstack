<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>UAO Conecta</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('uao_theme')==='dark'?'dark':'light'}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Slab:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#363636;--strong:#161616;--mut:#5c5c5c;--line:#d9d9d9;--soft:#ececec;--red:#c4161c;--red2:#ed1d24;--onred:#fff;--ok:#0b7a4b;--warn:#a84300;--hero:#c4161c;--onhero:#fff;--nav:#363636;--navtx:#d9d9d9;--r:16px;--d:"Roboto Slab",Georgia,serif;--c:"Roboto Condensed","Roboto",Arial,sans-serif}
:root[data-theme=dark]{--bg:#000;--card:#0e0e0e;--ink:#fff;--strong:#fff;--mut:#d2d2d2;--line:#7a7a7a;--soft:#262626;--red:#ff5a60;--red2:#ff5a60;--onred:#000;--ok:#4ade80;--warn:#ffb454;--hero:#000;--onhero:#fff;--nav:#0e0e0e;--navtx:#e8e8e8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Roboto","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.logo{font-family:var(--d);letter-spacing:-.01em;color:var(--strong)}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0 0 6px;font-weight:700}
h2{font-size:20px;margin:30px 0 12px;font-weight:700}
h2.sec{display:flex;align-items:center;gap:10px}h2.sec:before{content:"";width:6px;height:22px;background:var(--red2);border-radius:2px}
h2.sec small{font:700 13px var(--c);color:var(--mut)}
h3{margin:0 0 6px;font-weight:600}p.s{color:var(--mut);margin:0 0 18px}
a{color:var(--red)}code{background:var(--soft);padding:1px 6px;border-radius:6px}
mark{background:color-mix(in srgb,var(--red2) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.kick{font-family:var(--c);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:rgba(255,255,255,.9)}
.srch{display:flex;gap:8px;align-items:center;font-family:var(--c);text-transform:uppercase;letter-spacing:.06em;font-size:14px;margin:20px 0 10px;color:var(--strong)}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
aside{display:none}
nav.bot{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav);border-radius:20px;display:flex;padding:5px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
[data-theme=dark] nav.bot{border:1px solid var(--line)}
nav a,aside a{color:var(--navtx);text-decoration:none;font-weight:700;cursor:pointer}
nav.bot a{flex:1;text-align:center;padding:7px 1px;font:700 10.5px var(--c);letter-spacing:.02em;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav.bot a.on{background:var(--red);color:var(--onred)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{padding:16px 14px 120px;max-width:1000px;margin:0 auto}
header.top{display:flex;gap:8px;align-items:center;margin-bottom:20px}
header.top .logo{font-weight:800;font-size:21px;margin-right:auto;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;background:var(--red2);border-radius:3px 12px 3px 12px;display:inline-block}.logo b{color:var(--red)}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;cursor:pointer;position:relative;display:grid;place-items:center}
.ib:hover{border-color:var(--red)}
.dot{font-weight:700;position:absolute;top:-6px;right:-6px;background:var(--red);color:var(--onred);border-radius:9px;font-size:11px;padding:0 5px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
details.card summary{cursor:pointer}details.card[open] summary{margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.grid .card{margin:0}
.grid.int{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{min-height:90px;resize:vertical}
.big{width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin:0}
label{font-weight:700;font-size:14px}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 18px;font:700 15px "Roboto",Arial,sans-serif;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.p{background:var(--red);border-color:var(--red);color:var(--onred)}.btn.p:hover{filter:brightness(1.08);color:var(--onred)}
.btn.sm{min-height:36px;padding:5px 14px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{display:inline-block;background:var(--soft);color:var(--ink);border-radius:6px;padding:2px 9px;font:700 12.5px var(--c);letter-spacing:.02em;margin:2px 4px 2px 0;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.mut{color:var(--mut);font-size:14px}.lk{cursor:pointer}.lk:hover{color:var(--red)}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:700 14px var(--c);white-space:nowrap}.chip.on{background:var(--red);color:var(--onred);border-color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.hero{background:var(--hero);color:var(--onhero);border-radius:24px;padding:26px 22px;margin-bottom:16px;position:relative;overflow:hidden}
[data-theme=dark] .hero{border:1px solid var(--red)}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:6px 70px 6px 70px;background:rgba(255,255,255,.12)}
.hero h1{color:var(--onhero)}.hero .mut{color:var(--onhero);opacity:.88}
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.cch{background:var(--cc,#363636);color:#fff;padding:16px 18px 14px;position:relative;overflow:hidden;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.cch:after{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:3px 50px 3px 50px;background:rgba(255,255,255,.14)}
.cch b{font:700 19px/1.2 var(--d);color:#fff;position:relative}.cch .cod{font:700 13px var(--c);letter-spacing:.06em;color:rgba(255,255,255,.9);position:relative}
.cch .kick{position:absolute;top:12px;left:18px}
.ccb{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:800 26px var(--d);color:var(--strong);line-height:1.1}.stat span{font:700 12px var(--c);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.dl{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.dl:last-child{border:0}
.dl .dt{font:800 13px var(--d);min-width:52px;text-align:center;background:var(--soft);border-radius:10px;padding:6px 4px;line-height:1.2;color:var(--strong)}
.empty{text-align:center;color:var(--mut);padding:26px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font:700 12px var(--c);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.ans{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:12px 0}.ans.sol{border-color:var(--ok)}
.sk{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1s infinite;margin-bottom:12px}@keyframes sk{to{background-position:-200% 0}}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#363636;color:#fff;border:1px solid #7a7a7a;padding:12px 20px;border-radius:12px;z-index:20;max-width:92vw;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.auth{max-width:420px;margin:6vh auto 0}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
#sr:empty{display:none}#sr{margin-top:6px}
/* logo institucional en barra lateral */
.side-logo{display:flex;align-items:center;gap:10px;margin:0 0 20px 4px;text-decoration:none}
.side-logo img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)}
.side-logo .logo{margin:0!important}
/* modo demo */
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.mis{border-left:5px solid var(--line)}.mis.ok{border-left-color:var(--ok)}
.mis h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mis .n{font:800 13px var(--c);background:var(--soft);border-radius:8px;padding:2px 8px}
.formula{font:500 14px ui-monospace,Consolas,monospace;background:var(--soft);border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre-wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--red);border-radius:var(--r);padding:12px 16px;margin:14px 0}
/* ---------- pantalla de ingreso (2 columnas) ---------- */
body.out aside,body.out nav.bot,body.out main{display:none!important}
#auth{display:none}body.out #auth{display:grid}
#auth{min-height:100vh;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.lg-l{background:#1c1c1c;color:#fff;position:relative;overflow:hidden;padding:clamp(32px,7vw,96px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center}
.lg-l:after{content:"";position:absolute;width:760px;height:760px;border-radius:50%;border:110px solid rgba(196,22,28,.22);right:-330px;bottom:-470px;pointer-events:none}
.lg-l>*{position:relative;z-index:1}
.lg-logo{width:144px;height:140px;background:#fff;border-radius:16px;display:grid;place-items:center;padding:12px;margin-bottom:56px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lg-logo img{max-width:100%;max-height:100%;object-fit:contain}
.lg-logo .tx{font:500 13px/1.1 "Roboto",Arial,sans-serif;color:#222;text-align:center}.lg-logo .tx b{display:block;font:800 17px/1.1 "Roboto",Arial,sans-serif;color:#1c1c1c;margin:2px 0}
.lg-kick{font:700 14px var(--d);letter-spacing:.16em;text-transform:uppercase;color:#ef3b41;margin:0 0 18px}
.lg-l h1{color:#fff;font:700 clamp(44px,6.4vw,86px)/1.02 var(--d);letter-spacing:-.02em;margin:0 0 30px}.lg-l h1 span{color:#ef2b32}
.lg-l p.d{font-size:clamp(17px,1.5vw,23px);line-height:1.55;color:#e6e6e6;max-width:640px;margin:0 0 40px}
.lg-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:14px;margin-bottom:46px}
.lg-tile{display:block;text-decoration:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:20px 20px 18px;color:#fff;cursor:pointer;text-align:left;font:inherit}
.lg-tile:hover{border-color:#ef2b32;background:rgba(239,43,50,.08)}.lg-tile b{display:block;font:700 18px "Roboto",Arial,sans-serif;margin-bottom:6px}.lg-tile span{color:#cfcfcf;font-size:15px}
.lg-q{font-style:italic;color:#e0e0e0;font-size:19px;margin:0}
.lg-r{background:#f8f6f3;display:grid;place-items:center;padding:32px 20px}
.lg-card{width:100%;max-width:548px;background:#fff;border-radius:28px;border-top:7px solid #d4141b;padding:46px 40px 40px;box-shadow:0 18px 50px rgba(0,0,0,.08);color:#363636}
.lg-card h2{font:700 34px var(--d);color:#161616;margin:0 0 10px}.lg-card h2:before{display:none}
.lg-card .s{color:#5c5c5c;font-size:19px;margin:0 0 26px}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;min-height:60px;border:1.5px solid #dcdcdc;border-radius:999px;background:#fff;color:#2b2b2b;font:500 20px "Roboto",Arial,sans-serif;text-decoration:none;cursor:pointer}
.g-btn:hover{border-color:#c4161c;box-shadow:0 2px 10px rgba(0,0,0,.06)}.g-btn svg{width:24px;height:24px}
.lg-card .n{color:#5c5c5c;font-size:17px;line-height:1.6;margin:18px 0 0}.lg-card .n b{color:#222}
.lg-card .or{color:#7a7a7a}.lg-card .or:before,.lg-card .or:after{background:#e2e2e2}
.ex-box{margin-top:22px;border:1.5px solid #f0c4c6;background:#fff7f7;border-radius:18px;padding:18px}
.ex-box h3{font:700 19px var(--d);color:#161616;margin:0 0 4px}.ex-box p{color:#555;font-size:15px;margin:0 0 12px}
.cred{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;background:#fff;border:1px solid #ececec;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.cred span{color:#6b6b6b;font-weight:700}.cred code{font-size:15px;background:#f3f3f3;color:#161616;padding:3px 8px;border-radius:6px;word-break:break-all}
.cp{border:1px solid #dcdcdc;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:700 12px "Roboto",Arial,sans-serif;color:#363636}.cp:hover{border-color:#c4161c;color:#c4161c}
.ex-box .inc{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}.ex-box .inc .tag{background:#fff;border:1px solid #eee;color:#444}
.demo-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.demo-b{border:1.5px solid #dcdcdc;background:#fff;color:#2b2b2b;border-radius:14px;padding:12px 6px;cursor:pointer;font:700 15px "Roboto",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
.demo-b small{font:400 12px "Roboto",Arial,sans-serif;color:#6b6b6b}.demo-b:hover{border-color:#c4161c;color:#c4161c}
.lg-card code{background:#f1f1f1;color:#222}
.lg-card details{margin-top:14px}.lg-card summary{cursor:pointer;color:#5c5c5c;font-size:14px}
.lg-card input{background:#fff;color:#222;border-color:#dcdcdc}
@media(max-width:980px){#auth{grid-template-columns:1fr}.lg-tiles{grid-template-columns:1fr}.lg-logo{margin-bottom:32px;width:120px;height:116px}.lg-l:after{display:none}.lg-card{padding:36px 24px 28px}}
button:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(min-width:800px){
aside{display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--card);border-right:1px solid var(--line);padding:24px 14px}
aside a{padding:11px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;color:var(--ink);font:700 15px var(--c);letter-spacing:.02em}aside a:hover{background:var(--soft)}aside a.on{background:var(--red);color:var(--onred)}
aside .logo{font-size:22px;font-weight:800;margin:0 0 20px 6px;display:flex;gap:8px;align-items:center}
nav.bot{display:none}main{margin-left:236px;max-width:none;padding:28px 40px 60px}#toast{bottom:30px}
}
</style>
</head>
<body>
<div id="auth"></div><aside id="side"></aside><main id="m"></main><nav class="bot" id="bot" aria-label="Navegación principal"></nav><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); // texto seguro dentro de onclick='...'
const URLS={classroom:'https://classroom.google.com',moodle:'https://campus.uaovirtual.edu.co',portal:'https://uao.universitasxxi.cloud/portal'}; // ← ajusta la URL del portal si es otra
const APP_V='1.3.0';
let CFG={sso:false,demo:true,domain:'uao.edu.co',periodo:'2026-2S'};
const base=()=>({me:{n:'',rol:'Estudiante',prog:'Ingeniería Multimedia',email:'',cursos:[],demo:false,portal:null,fuentes:{moodle:{conectado:false,cursos:[]},classroom:{conectado:false,cursos:[]},manual:[]}},q:[],R:[],G:[],A:[],T:[],F:[],E:[],P:[],catalog:[],apoyo:[],periodo:''});
let TOKEN='';try{TOKEN=localStorage.getItem('uao_t')||''}catch{}
let S=base(),FIL={s:'',e:'pend',q:'',p:'',rs:'',rt:''};
const PER=()=>S.periodo||CFG.periodo||'2026-2S';
const ST={'Sin respuesta':'○ Sin respuesta','En discusión':'◐ En discusión','Resuelta':'✓ Resuelta','Pendiente':'○ Pendiente','En proceso':'◐ En proceso','Completada':'✓ Completada','Aceptada':'◐ Aceptada','Rechazada':'✕ Rechazada','Entregada':'✓ Entregada'};
const stc=s=>['Resuelta','Completada','Entregada'].includes(s)?'ok':['Sin respuesta','Pendiente'].includes(s)?'w':s==='Rechazada'?'bad':'';
const bd=s=>`<span class="tag ${stc(s)}">${ST[s]||esc(s)}</span>`;
const SRC={moodle:{t:'UAO Virtual',c:'#f98012'},classroom:{t:'Google Classroom',c:'#1e8e3e'},manual:{t:'Manual',c:'#8a8a8a'}};
const sdot=k=>`<span class="sdot" style="background:${SRC[k]?.c||'#8a8a8a'}"></span>`;
const COL=['#c4161c','#363636','#9b1117','#4a4a4a'],colOf=n=>COL[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const nm=n=>{const r=String(n||''),k=(r.match(/^\s*(\d{3,})/)||[])[1];if(k){const c=(S.catalog||[]).find(m=>m.cod===k);if(c)return c.n}const p=r.split(' · ');return p.find(x=>!/^\d/.test(x))||p[p.length-1]};
const sig=n=>{const c=(S.catalog||[]).find(m=>m.n===n);return c?.sigla?` (${c.sigla})`:''};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const SK='<div class="sk"></div><div class="sk"></div>';
const FOOT='<footer class="mut" style="margin-top:32px;padding-top:16px;border-top:1px solid var(--line)"><b>UAO Conecta</b> · Proyecto académico de IHC y Diseño Centrado en el Usuario · ODS 4: Educación de calidad</footer>';

/* ---------- búsqueda difusa (fuzzy) sin librerías ---------- */
const fold=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function lev(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;let p=Array.from({length:b.length+1},(_,j)=>j);
 for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
const subseq=(t,w)=>{let i=0;for(const ch of w)if(ch===t[i])i++;return i===t.length};
function tokScore(t,words,acr){let best=0;
 for(const w of words){
  if(w===t)return 3;
  if(w.startsWith(t))best=Math.max(best,2.5);
  else if(t.length>=3&&w.includes(t))best=Math.max(best,2);
  else if(t.length>=4&&w.length>=3){const tol=t.length>=7?2:1,d=Math.min(lev(t,w),lev(t,w.slice(0,t.length)));if(d<=tol)best=Math.max(best,1.6-d*.4)}
  if(!best&&t.length>=4&&t[0]===w[0]&&w.length<=t.length*2&&subseq(t,w))best=.8}
 if(t.length>=2&&acr.some(a=>a===t))best=Math.max(best,2.8);
 return best}
// Devuelve una puntuación >0 si TODAS las palabras de la consulta coinciden (exacta, prefijo, typo o sigla)
function fuzzy(q,...fields){const qt=fold(q).split(' ').filter(Boolean);if(!qt.length)return 1;
 const flat=fields.flat(2).filter(x=>x!=null&&x!=='').map(String),words=fold(flat.join(' ')).split(' ').filter(Boolean);
 const acr=flat.map(f=>fold(f).split(' ').filter(w=>w.length>2).map(w=>w[0]).join('')).filter(a=>a.length>=2);
 let s=0;for(const t of qt){const v=tokScore(t,words,acr);if(!v)return 0;s+=v}return s/qt.length}
const rank=(l,fn)=>(l||[]).map(x=>[x,fn(x)]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);

/* Resultados de búsqueda: lim = máx. por sección (0 = sin límite) */
function results(q,lim){
 const k=String(q||'').trim(),cut=l=>lim?l.slice(0,lim):l,cat=catalogCourses(),po=S.me?.portal;
 if(!k)return lim?'':`<h2 class="sec">Todas las materias <small>(${cat.length})</small></h2><div class="grid">${cat.map(ccard).join('')||'<div class="empty">Sin materias.</div>'}</div>`;
 const F=(l,f)=>rank(l,x=>fuzzy(k,f(x)));
 const sec=[
  ['Materias',F(cat,x=>[x.n,x.cod,x.alias||[],x.area,x.desc]),l=>`<div class="grid">${l.map(ccard).join('')}</div>`],
  ['Notas',F(po?.notas||[],x=>[x.s,x.cod]),l=>l.map(ncard).join('')],
  ['Docentes y monitores',F(S.P,x=>[x.n,x.s,x.info,x.r]),l=>l.map(pcard).join('')],
  ['Recursos',F(S.R,x=>[x.n,x.d,x.s,x.ty]),l=>l.map(rcard).join('')],
  ['Servicios de apoyo',F(S.apoyo,x=>[x.n,x.d]),l=>l.map(acard).join('')],
  ['Dudas',F(S.q,x=>[x.t,x.d,x.s,x.tags||[]]),l=>l.map(qcard).join('')],
  ['Entregas',F(S.E,x=>[x.n,x.s]),l=>`<div class="card">${l.map(x=>erow(x)).join('')}</div>`]
 ].filter(s=>s[1].length);
 if(!sec.length)return `<div class="empty card">Sin resultados para «${esc(k)}». Prueba con otra palabra o una sigla (ej. «ihc», «poo»).</div>`;
 return sec.map(([t,l,f])=>`<h2 class="sec">${t} <small>(${l.length})</small></h2>${f(cut(l))}`).join('')}

let DM=dmNew();try{DM={...dmNew(),...JSON.parse(localStorage.getItem(DM_KEY)||'{}')}}catch{}
const dmSave=()=>{try{localStorage.setItem(DM_KEY,JSON.stringify(DM))}catch{}};

function dmMark(k,msg){const was=DM.done[k];DM.done[k]=1;dmSave();if(!was)toast('✓ Misión completada: '+msg)}
const dmUp=()=>{dmSave();if(curView()==='demo')render(1)};
function dmFill(s){const n=(S.me?.portal?.notas||[]).find(x=>x.s===s);if(!n||!n.n?.length)return;$('dm_c1').value=n.n[0];$('dm_c2').value=n.n[1]}
function dmCalc(){const c1=parseFloat(String(val('dm_c1')).replace(',','.')),c2=parseFloat(String(val('dm_c2')).replace(',','.'));
 if(!(c1>=0&&c1<=5&&c2>=0&&c2<=5))return toast('Escribe notas entre 0.0 y 5.0');DM.calc={c1,c2,r:1};dmMark('calc','calcular tu nota');dmUp()}
function dmEnt(){const n=val('dm_en');if(!n)return toast('Escribe el nombre de la entrega');DM.ent.push({n,s:val('dm_es'),f:new Date().toLocaleDateString('es-CO',{day:'numeric',month:'short'}),ok:0});toast('Entrega de práctica agregada. Ahora márcala como entregada.');dmUp()}
function dmEntOk(i){if(DM.ent[i])DM.ent[i].ok=1;dmMark('ent','registrar y entregar');dmUp()}
function dmQ(){const t=val('dm_qt'),s=val('dm_qs');if(!t)return toast('Escribe tu duda');const m=(S.P||[]).find(p=>p.r==='Monitor'&&p.s===s)||(S.P||[]).find(p=>p.r==='Monitor');
 DM.q={t,s,a:null,sol:0};dmUp();setTimeout(()=>{if(!DM.q)return;DM.q.a={n:m?.n||'Monitor de ejemplo',x:`¡Buena pregunta! Sobre «${t}»: empieza por repasar el material de ${s} en la pestaña Recursos y, si sigues con dudas, agenda una monitoría conmigo. (Respuesta simulada)`};toast('Un monitor respondió tu duda de práctica');dmUp()},1800)}
function dmSol(){if(DM.q){DM.q.sol=1;dmMark('duda','resolver una duda')}dmUp()}
function dmAse(){const id=+val('dm_ap'),m=(S.P||[]).find(p=>p.id===id),tema=val('dm_at');if(!tema)return toast('Escribe el tema');
 DM.as={pn:m?.n||'Monitor',tema,hor:val('dm_ah'),mod:val('dm_am'),st:'Pendiente'};toast('Solicitud de práctica enviada');dmUp();
 setTimeout(()=>{if(!DM.as)return;DM.as.st='Aceptada';dmMark('ase','solicitar una asesoría');dmUp()},2200)}
function dmBus(q){DM.bus=q;dmMark('bus','usar el buscador');dmUp()}
function dmReset(){DM=dmNew();dmSave();toast('Práctica reiniciada');render(1)}

 const EX=CFG.ejemplo||{email:'ejemplo@demo.uao',password:'Ejemplo2026'};
 const ex=`<div class="ex-box" id="ejemplo"><h3>🧪 Cuenta de ejemplo</h3><p>¿Quieres ver cómo funciona? Entra con esta cuenta: todo viene con datos de ejemplo y no se conecta a plataformas reales.</p>

  <button class="btn p" style="width:100%" onclick="login('${jsq(EX.email)}','${jsq(EX.password)}')">Entrar a la cuenta de ejemplo</button></div>`;
 const demo=CFG.demo?`<div class="or">otras cuentas de demostración por rol</div>
  <div class="demo-g"><button class="demo-b" onclick="login('estudiante@demo.uao','demo1234')">🎓 Estudiante<small>estudiante@demo.uao</small></button><button class="demo-b" onclick="login('docente@demo.uao','demo1234')">👩‍🏫 Docente<small>docente@demo.uao</small></button><button class="demo-b" onclick="login('monitor@demo.uao','demo1234')">🙋 Monitor<small>monitor@demo.uao</small></button></div>
  <p class="n" style="font-size:15px;margin-top:12px">Clave de las cuentas por rol: <code>demo1234</code></p>`:'';
 const form=`<details><summary>Ingresar con correo y contraseña</summary><label for="lg_e">Correo</label><input id="lg_e" type="email" value="${esc(EX.email)}" autocomplete="username"><label for="lg_p">Contraseña</label><input id="lg_p" type="password" value="" placeholder="${esc(EX.password)}" autocomplete="current-password" onkeydown="if(event.key==='Enter')login(val('lg_e'),this.value)"><button class="btn p" style="width:100%" onclick="login(val('lg_e'),$('lg_p').value)">Ingresar</button></details>`;
 $('auth').innerHTML=`<section class="lg-l">
  <div class="lg-logo"><img src="/img/logo-uao.png" alt="Universidad Autónoma de Occidente" onerror="this.outerHTML=LOGO_TX"></div>
  <p class="lg-kick">Tu vida académica · Una sola cuenta</p>

   <a class="lg-tile" href="${URLS.moodle}" target="_blank" rel="noopener"><b>UAO Virtual</b><span>Cursos, fechas y entregas</span></a>

   <button class="lg-tile" type="button" onclick="toast('Inicia sesión para ver docentes, monitores y recursos de apoyo.');document.querySelector('.g-btn')?.focus()"><b>Apoyo académico</b><span>Docentes y monitores</span></button>
  </div>
  <p class="lg-q">Aprender es mejor cuando nadie se queda con la duda.</p>
 </section>
 <section class="lg-r"><div class="lg-card">
  <h2>Ingresar</h2><p class="s">Usa tu cuenta institucional para continuar.</p>${OLD_SRV()?`<p style="background:#fff4e5;border:1px solid #f0b46a;color:#7a4100;border-radius:12px;padding:10px 12px;font-size:14px">⚠️ ${OLD_MSG}</p>`:''}
  <a class="g-btn" href="/api/auth/google">${GLOGO}Iniciar sesión con Google</a>
  <p class="n">Usa tu cuenta institucional <b>@${esc(CFG.domain)}</b>. Se abrirá una ventana de Google para elegir tu cuenta.${CFG.sso?'':' <span style="color:#a84300">(El ingreso con Google aún no está configurado en este servidor.)</span>'}</p>
  ${ex}${demo}${form}
 </div></section>`}
function cp(t){(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Copiado: '+t)).catch(()=>toast(t))}
const OLD_SRV=()=>CFG.version!==APP_V;
const OLD_MSG='El servidor sigue ejecutando una versión anterior de server.js. Detenlo (Ctrl + C) y vuelve a ejecutar «npm start».';
async function login(email,pw){if(OLD_SRV())toast(OLD_MSG);try{const d=await api('POST','/auth/login',{email,password:pw});setToken(d.token);await load();FIL={s:'',e:'pend',q:'',p:'',rs:'',rt:''};if(location.hash==='#inicio'||!location.hash){render()}else location.hash='inicio'}catch(e){toast(OLD_SRV()?OLD_MSG:e.message)}}
function setToken(t){TOKEN=t;try{localStorage.setItem('uao_t',t)}catch{}}
function logout(){TOKEN='';try{localStorage.removeItem('uao_t')}catch{}S=base();render()}

/* ---------- acciones ---------- */
async function sync(k){
 if(k==='moodle'){const url=val('m_ical');
  if(url)return act(()=>api('POST','/me/ical',{url}),'Calendario de UAO Virtual sincronizado');
  if(S.me.mc)return act(()=>api('POST','/me/sync'),'Cursos de UAO Virtual sincronizados');
  if(CFG.demo)return act(()=>api('POST','/me/demo/moodle'));
  return toast('Pega el enlace del calendario de UAO Virtual.')}
 if(k==='classroom'){
  if(S.me.gc)return act(()=>api('GET','/me/classroom'),'Google Classroom sincronizado');
  if(CFG.sso&&!S.me.demo){try{const r=await api('POST','/me/classroom/start');location.href=r.url}catch(e){toast(e.message)}return}
  if(CFG.demo)return act(()=>api('POST','/me/demo/classroom'));
  return toast('El ingreso con Google no está configurado en este servidor.')}
 if(k==='portal'){if(CFG.demo)return act(()=>api('POST','/me/demo/portal'));toast('La consulta automática del Portal no está disponible en este servidor.')}
}
const togE=id=>act(()=>api('POST','/deliveries/'+id+'/toggle'));
function addE(){const n=val('en_n'),due=val('en_d');if(!n)return toast('Escribe el nombre de la entrega');if(!due)return toast('Elige la fecha límite');act(()=>api('POST','/deliveries',{n,s:val('en_s'),due}),'Entrega agregada')}
function addQuestion(){const t=val('dq_t'),d=val('dq_d');if(!t||!d)return toast('Completa el título y la descripción');act(()=>api('POST','/questions',{t,d,s:val('dq_s'),anon:$('dq_a')?.checked}),'Duda publicada')}
function answerQ(id){const x=val('ans_x');if(!x)return toast('Escribe tu respuesta');act(()=>api('POST','/questions/'+id+'/answers',{x}),'Respuesta publicada')}
const voteA=(q,a)=>act(()=>api('POST',`/questions/${q}/answers/${a}/useful`));
const markQ=(id,st)=>act(()=>api('PATCH','/questions/'+id,{st}),st==='Resuelta'?'Duda marcada como resuelta':'Duda reabierta');
const solA=(id,i,on)=>act(()=>api('POST','/questions/'+id+'/solution',{i,off:on}),on?'Solución retirada':'Respuesta marcada como solución');
function addT(){const n=val('tn');if(!n)return toast('Escribe el nombre de la tarea');act(()=>api('POST','/tasks',{n,w:val('tw'),d:val('td')}),'Tarea creada')}
function nextT(id){const o=['Pendiente','En proceso','Completada'],t=(S.T||[]).find(x=>x.id===id),st=o[(o.indexOf(t?.st)+1)%o.length];act(()=>api('PATCH','/tasks/'+id,{st}),'Tarea: '+st)}
function addF(){const n=val('fa');if(!n)return toast('Escribe el acuerdo');act(()=>api('POST','/files',{n}),'Acuerdo registrado')}
function addGroup(){const n=val('gn');if(!n)return toast('Escribe el nombre de la comunidad');act(()=>api('POST','/groups',{n,s:val('gs')}),'Comunidad creada')}
const joinG=id=>act(()=>api('POST','/groups/'+id+'/join'));
async function addRes(){const n=val('rn');if(!n)return toast('Falta el título del recurso');
 const f=$('rf')?.files?.[0];let data='',fname='';
 if(f){if(f.size>3e6)return toast('El archivo supera 3 MB');
  data=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ko;r.readAsDataURL(f)}).catch(()=>'');fname=f.name}
 act(()=>api('POST','/resources',{n,s:val('rs'),ty:val('rt'),d:val('rd'),fname,data}),'Recurso subido')}
async function dl(id){const r=(S.R||[]).find(x=>x.id==id);try{const x=await fetch('/api/resources/'+id+'/download',{headers:{Authorization:'Bearer '+TOKEN}});if(!x.ok)throw 0;
 const b=await x.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=r?.file?.name||((r?.n||'recurso')+'.txt');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch{toast('No se pudo descargar el recurso')}}
async function sendA(id,rol){const tema=val('at'),msg=val('am');if(!tema)return toast('Escribe el tema');if(!msg)return toast('Escribe un mensaje');
 try{await api('POST','/advisories',{p:id,tema,msg,mod:val('am_mod'),hor:val('ah')});toast('Solicitud enviada');await load();go('rutas/'+(rol==='Monitor'?'monitores':'docentes'))}catch(e){toast(e.message)}}
const stA=(id,st)=>act(()=>api('PATCH','/advisories/'+id,{st}),'Estado actualizado');

/* ---------- arranque: config, retorno de Google OAuth y sesión ---------- */
(async()=>{
 try{const c=await fetch('/api/config').then(r=>r.json());CFG={...CFG,...c}}catch{}
 const h=location.hash,sso=h.match(/[#&]sso=([^&]+)/),err=h.match(/[#&]ssoerror=([^&]+)/);
 if(sso){try{const d=await api('POST','/auth/exchange',{code:sso[1]});setToken(d.token)}catch(e){toast(e.message)}history.replaceState(null,'',location.pathname+'#inicio')}
 if(err){toast(decodeURIComponent(err[1]));history.replaceState(null,'',location.pathname)}
 if(/[?&]classroom=error/.test(location.search)){toast('No se pudo conectar Google Classroom.');history.replaceState(null,'',location.pathname+location.hash)}
 if(TOKEN){try{await load()}catch{TOKEN='';try{localStorage.removeItem('uao_t')}catch{}}}
 render();
 // Refresco en segundo plano de plataformas reales ya conectadas
 if(TOKEN&&(S.me.gc||S.me.mc)){await Promise.all([S.me.gc&&api('GET','/me/classroom').catch(()=>0),S.me.mc&&api('GET','/me/virtual').catch(()=>0)]);try{await load();render(1)}catch{}}
})();
</script>
